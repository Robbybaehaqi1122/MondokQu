services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mondok-qu:latest
    container_name: mondokqu-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: "${APP_URL}"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${APP_NAME}"
      SENTRY_LARAVEL_DSN: "${SENTRY_LARAVEL_DSN}"
      SENTRY_TRACES_SAMPLE_RATE: 0.2
      SENTRY_ENABLE_LOGS: true
    volumes:
      - .:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mondok-qu-network

  nginx:
    image: nginx:1.27-alpine
    container_name: mondokqu-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mondok-qu-network

  mariadb:
    image: mariadb:11.4
    container_name: mondokqu-mariadb
    restart: unless-stopped
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mondok-qu-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mondok-qu-network

  redis:
    image: redis:7-alpine
    container_name: mondokqu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mondok-qu-redis:/data
    networks:
      - mondok-qu-network

  scheduler:
    image: mondok-qu:latest
    container_name: mondokqu-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      FILESYSTEM_DISK: local
      SENTRY_LARAVEL_DSN: "${SENTRY_LARAVEL_DSN}"
      SENTRY_ENABLE_LOGS: true
    volumes:
      - .:/var/www/html
    depends_on:
      - mariadb
      - redis
    networks:
      - mondok-qu-network

volumes:
  mondok-qu-db:
  mondok-qu-redis:

networks:
  mondok-qu-network:
    driver: bridge
