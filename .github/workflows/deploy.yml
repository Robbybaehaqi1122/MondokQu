name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  APP_NAME: Mondok Qu

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json
        run: composer validate --no-check-all --strict

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql, bcmath, ctype, json, openssl, xml, xmlwriter
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies (no dev)
        run: composer install --no-dev --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # Navigate to app directory
            cd ${{ secrets.DEPLOY_PATH }}

            # Put application in maintenance mode
            php artisan down --retry=30 --render="errors::503"

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Update PHP dependencies
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --no-progress --no-interaction --prefer-dist --optimize-autoloader

            # Update Node dependencies and build
            npm ci
            npm run build

            # Run migrations
            php artisan migrate --force

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Create storage link if not exists
            php artisan storage:link || true

            # Restart queue worker
            php artisan queue:restart

            # Bring application back up
            php artisan up

            echo "Deployment completed successfully!"
